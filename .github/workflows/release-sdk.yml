name: Release SDK

on:
  push:
    branches:
      - main
      - staging
      - dev
    paths:
      - 'packages/sdk/**'
      - '.github/workflows/release-sdk.yml'
  workflow_dispatch:
    inputs:
      ci_test:
        description: Check npm OIDC authorization only; do not publish
        required: false
        type: boolean
        default: false

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Version & Publish
    if: github.event_name != 'workflow_dispatch' || !inputs.ci_test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test and build SDK
        run: pnpm --filter @mysten-incubation/memwal test

      # ── main branch → changeset version + stable release (latest) ──
      - name: Apply changesets (update version & CHANGELOG)
        if: github.ref == 'refs/heads/main'
        id: changeset_version
        run: |
          # Consume pending changesets → bump version + update CHANGELOG.md
          pnpm changeset version 2>/dev/null || true
          # Check if changeset produced any changes
          if git diff --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit changelog & version bump
        if: github.ref == 'refs/heads/main' && steps.changeset_version.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: version packages & update changelog [skip ci]"
          git push

      - name: Publish stable release
        if: github.ref == 'refs/heads/main'
        id: publish_sdk
        run: |
          VERSION=$(node -p "require('./packages/sdk/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          npm view @mysten-incubation/memwal@$VERSION version 2>/dev/null \
            && echo "Version $VERSION already published, skipping" && echo "published=false" >> $GITHUB_OUTPUT && exit 0
          cd packages/sdk && pnpm publish --provenance --access public --no-git-checks
          echo "published=true" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' && steps.publish_sdk.outputs.published == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const version = '${{ steps.publish_sdk.outputs.version }}';
            const tag = `@mysten-incubation/memwal@${version}`;
            // Extract latest changelog entry
            let body = `Release @mysten-incubation/memwal v${version}`;
            try {
              const changelog = fs.readFileSync('packages/sdk/CHANGELOG.md', 'utf8');
              const match = changelog.match(/## \d+\.\d+\.\d+[\s\S]*?(?=## \d+\.\d+\.\d+|$)/);
              if (match) body = match[0].trim();
            } catch (e) { /* use default body */ }
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: tag,
              body,
              draft: false,
              prerelease: false,
            });

      # ── staging branch → release candidate (rc tag, auto-increment) ──
      - name: Publish staging release candidate
        if: github.ref == 'refs/heads/staging'
        run: .github/scripts/publish-prerelease.sh packages/sdk @mysten-incubation/memwal rc

      # ── dev branch → prerelease (dev tag, auto-increment) ──
      - name: Publish dev prerelease
        if: github.ref == 'refs/heads/dev'
        run: .github/scripts/publish-prerelease.sh packages/sdk @mysten-incubation/memwal dev

  oidc-probe:
    name: Check npm OIDC authorization
    if: github.event_name == 'workflow_dispatch' && inputs.ci_test && github.ref == 'refs/heads/codex/mcp-publish-ci-test'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Diagnose npm OIDC trust
        uses: actions/github-script@v7
        with:
          script: |
            const idToken = await core.getIDToken('npm:registry.npmjs.org');
            const claims = JSON.parse(Buffer.from(idToken.split('.')[1], 'base64url').toString());
            const keys = ['iss', 'aud', 'sub', 'repository', 'repository_id', 'repository_owner',
              'repository_owner_id', 'workflow_ref', 'job_workflow_ref', 'ref',
              'event_name', 'environment', 'runner_environment'];
            core.info('OIDC identity: ' + JSON.stringify(Object.fromEntries(
              keys.map(key => [key, claims[key] ?? null])
            )));
            const pkg = JSON.parse(require('node:fs').readFileSync('packages/sdk/package.json', 'utf8'));
            core.info('Package identity: ' + JSON.stringify({name: pkg.name, repository: pkg.repository}));
            const publicResponse = await fetch('https://registry.npmjs.org/' + encodeURIComponent(pkg.name));
            core.info('Public package metadata HTTP status: ' + publicResponse.status);
            const response = await fetch(
              'https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/' + encodeURIComponent(pkg.name),
              {method: 'POST', headers: {Authorization: 'Bearer ' + idToken}}
            );
            const data = await response.json().catch(() => ({}));
            if (data.token) core.setSecret(data.token);
            core.info('npm OIDC exchange HTTP status: ' + response.status);
            if (!response.ok) {
              core.info('npm OIDC error: ' + JSON.stringify({
                code: data.code, error: data.error, message: data.message
              }));
              throw new Error('npm rejected the workflow identity before publication');
            }
            core.info('npm accepted the workflow identity; no token contents were logged.');

