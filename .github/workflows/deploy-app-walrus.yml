name: Deploy App to Walrus Site

on:
  push:
    branches:
      - main
    paths:
      - 'apps/app/**'
      - '.github/workflows/deploy-app-walrus.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-app:
    runs-on: ubuntu-latest
    environment: mainnet

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate ws-resources.json exists
        run: |
          if [ ! -f "./apps/app/ws-resources.json" ]; then
            echo "## Deployment Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Missing required file: \`apps/app/ws-resources.json\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "This file is generated after your first manual deployment with \`site-builder\`." >> $GITHUB_STEP_SUMMARY

            echo "ERROR: apps/app/ws-resources.json not found!"
            echo "This file is generated after your first manual deployment with site-builder."
            exit 1
          fi
          echo "ws-resources.json found!"

      - name: Build SDK
        run: pnpm build:sdk

      - name: Build app for Mainnet
        working-directory: ./apps/app
        run: |
          pnpm build
          if [ -f "ws-resources.json" ]; then
            cp ws-resources.json dist/
          fi
        env:
          VITE_SUI_NETWORK: mainnet
          # The app's Sui client is gRPC. Left unset it falls back to the public
          # mainnet fullnode (see App.tsx); set the repo variable to point at a
          # dedicated endpoint.
          VITE_SUI_GRPC_URL: ${{ vars.VITE_SUI_GRPC_URL }}
          VITE_MEMWAL_SERVER_URL: ${{ vars.VITE_MEMWAL_SERVER_URL }}
          VITE_MEMWAL_PACKAGE_ID: ${{ vars.VITE_MEMWAL_PACKAGE_ID }}
          VITE_MEMWAL_REGISTRY_ID: ${{ vars.VITE_MEMWAL_REGISTRY_ID }}
          VITE_LEGACY_MEMWAL_PACKAGE_ID: ${{ vars.VITE_LEGACY_MEMWAL_PACKAGE_ID }}
          VITE_LEGACY_MEMWAL_REGISTRY_ID: ${{ vars.VITE_LEGACY_MEMWAL_REGISTRY_ID }}
          VITE_SEAL_KEY_SERVERS: ${{ vars.VITE_SEAL_KEY_SERVERS }}
          VITE_LEGACY_SEAL_KEY_SERVERS: ${{ vars.VITE_LEGACY_SEAL_KEY_SERVERS }}
          VITE_ENABLE_MEMORY_DELETION: ${{ vars.VITE_ENABLE_MEMORY_DELETION }}
          VITE_SECURITY_DELETE_ENABLED: ${{ vars.VITE_SECURITY_DELETE_ENABLED }}
          VITE_MIGRATION_COMPLETED_DATE: ${{ vars.VITE_MIGRATION_COMPLETED_DATE }}
          VITE_SECURITY_GUIDE_URL: ${{ vars.VITE_SECURITY_GUIDE_URL }}
          VITE_ENOKI_API_KEY: ${{ vars.VITE_ENOKI_API_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_DOCS_URL: ${{ vars.VITE_DOCS_URL }}
          VITE_CONSOLE_URL: ${{ vars.VITE_CONSOLE_URL }}
          VITE_PRIVACY_POLICY_URL: ${{ vars.VITE_PRIVACY_POLICY_URL }}
          VITE_TERMS_OF_SERVICE_URL: ${{ vars.VITE_TERMS_OF_SERVICE_URL }}
          VITE_DEMO_URLS: ${{ vars.VITE_DEMO_URLS }}
          VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID }}
          VITE_GTM_CONTAINER_ID: ${{ vars.VITE_GTM_CONTAINER_ID }}
          VITE_ANALYTICS_ALLOWED_HOSTS: ${{ vars.VITE_ANALYTICS_ALLOWED_HOSTS }}
          VITE_POSTHOG_PROJECT_API_KEY: ${{ vars.VITE_POSTHOG_PROJECT_API_KEY }}
          VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
          VITE_POSTHOG_UI_HOST: ${{ vars.VITE_POSTHOG_UI_HOST }}

      - name: Deploy to Walrus Site (Mainnet)
        id: deploy-mainnet
        uses: MystenLabs/walrus-sites-github-actions/deploy@v1
        with:
          SUI_ADDRESS: ${{ vars.SUI_ADDRESS }}
          SUI_KEYSTORE: ${{ secrets.SUI_KEYSTORE }}
          DIST: ./apps/app/dist
          SUI_NETWORK: mainnet
          EPOCHS: ${{ vars.WALRUS_EPOCHS || '3' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WALRUS_CONFIG: |
            contexts:
              mainnet:
                system_object: 0x2134d52768ea07e8c43570ef975eb3e4c27a39fa6396bef985b5abc58d03ddd2
                staking_object: 0x10b9d30c28448939ce6c4d6c6e0ffce4a7f8a4ada8248bdad09ef8b70e4a3904
                n_shards: 1000
                max_epochs_ahead: 53
                wallet_config:
                  active_env: mainnet
                rpc_urls:
                  - https://fullnode.mainnet.sui.io:443
            default_context: mainnet
          SITES_CONFIG: |
            contexts:
              mainnet:
                portal: wal.app
                package: 0x26eb7ee8688da02c5f671679524e379f0b837a12f1d1d799f255b7eea260ad27
                staking_object: 0x10b9d30c28448939ce6c4d6c6e0ffce4a7f8a4ada8248bdad09ef8b70e4a3904
                general:
                  wallet_env: mainnet
                  walrus_context: mainnet
                  walrus_package: 0x98da433aa0139512c210597b1c5e3df6cd121d8d77f8652691bb66fadfc8aa1b
                  gas_budget: 500000000
            default_context: mainnet
