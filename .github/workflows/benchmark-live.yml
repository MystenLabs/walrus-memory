name: Benchmark Live

on:
  push:
    branches:
      - staging
      - dev
  workflow_dispatch:
    inputs:
      session_recall:
        description: Deployed recall sessions (remember_runs seeds isolated bench-session-* namespace; 0 is read-only)
        type: boolean
        default: false
      expected_server_commit:
        description: Required deployment SHA for session recall (optional)
        type: string
        default: ''
      seal_ab:
        description: Read-only live SEAL source A/B instead of deployed HTTP API benchmark (manual only)
        type: boolean
        default: false
      baseline_ref:
        description: Trusted baseline commit or branch for SEAL A/B
        type: string
        default: dev
      target_environment:
        description: GitHub benchmark environment to use
        required: true
        type: choice
        default: staging
        options:
          - dev
          - staging
      server_url:
        description: Walrus Memory server URL. Empty uses BENCH_SERVER_URL environment variable.
        required: false
        default: ''
      namespace:
        description: Memory namespace
        required: false
        default: benchmark
      remember_text:
        description: Remember benchmark text
        required: false
        default: benchmark memory
      query:
        description: Recall query text
        required: false
        default: benchmark memory
      limit:
        description: Top-K recall result limit
        required: false
        default: '5'
      remember_runs:
        description: Remember runs
        required: false
        default: '3'
      post_remember_sleep_secs:
        description: Seconds to wait after remember before recall phases
        required: false
        default: '30'
      cold_runs:
        description: Cold-path runs
        required: false
        default: '3'
      warm_runs:
        description: Warm-path runs
        required: false
        default: '10'
  schedule:
    - cron: '0 9 * * 1'

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  memory-api:
    name: Memory API Latency
    if: github.event_name != 'workflow_dispatch' || !inputs.seal_ab
    runs-on: ubuntu-latest
    environment:
      name: benchmark-${{ github.event_name == 'workflow_dispatch' && inputs.target_environment || (github.ref_name == 'staging' && 'staging' || 'dev') }}
    timeout-minutes: 30

    # Serializes against the sdk-e2e job in test-sdk.yml and the e2e job in
    # test-python-sdk.yml, which sign with this same BENCH_DELEGATE_KEY. The
    # relayer rate-limits per delegate key and per account, so two suites
    # running concurrently 429 each other. Group name must stay identical in
    # all three workflows — byte-identical on purpose, including the `main`
    # branch this workflow never runs on, so the three land in one group
    # whatever the expression resolves to.
    concurrency:
      group: bench-account-${{ github.event_name == 'workflow_dispatch' && inputs.target_environment || (github.ref_name == 'main' && 'production' || github.ref_name == 'staging' && 'staging' || 'dev') }}
      cancel-in-progress: false

    env:
      SESSION_RECALL: ${{ inputs.session_recall || false }}
      EXPECTED_SERVER_COMMIT: ${{ inputs.expected_server_commit || '' }}
      SERVER_URL: ${{ github.event.inputs.server_url || vars.BENCH_SERVER_URL }}
      NAMESPACE: ${{ github.event.inputs.namespace || 'benchmark' }}
      REMEMBER_TEXT: ${{ github.event.inputs.remember_text || 'benchmark memory' }}
      QUERY: ${{ github.event.inputs.query || 'benchmark memory' }}
      LIMIT: ${{ github.event.inputs.limit || '5' }}
      REMEMBER_RUNS: ${{ github.event.inputs.remember_runs || '3' }}
      POST_REMEMBER_SLEEP_SECS: ${{ github.event.inputs.post_remember_sleep_secs || '30' }}
      COLD_RUNS: ${{ github.event.inputs.cold_runs || '3' }}
      WARM_RUNS: ${{ github.event.inputs.warm_runs || '10' }}
      BENCH_DELEGATE_KEY: ${{ secrets.BENCH_DELEGATE_KEY }}
      BENCH_ACCOUNT_ID: ${{ secrets.BENCH_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: npm
          cache-dependency-path: services/server/scripts/package-lock.json

      - name: Install sidecar script dependencies
        working-directory: services/server/scripts
        run: npm ci

      - name: Wait for Railway deploy
        uses: ./.github/actions/wait-for-relayer
        with:
          server-url: ${{ env.SERVER_URL }}
          expected-commit: ${{ github.event_name == 'push' && github.sha || '' }}
          since-commit: ${{ github.event_name == 'push' && github.event.before || '' }}

      - name: Run memory API latency benchmark
        shell: bash
        run: |
          set -euo pipefail

          missing=0
          for name in SERVER_URL BENCH_DELEGATE_KEY BENCH_ACCOUNT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::${name} is required"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          mkdir -p benchmark-results
          if [ "$SESSION_RECALL" = "true" ]; then
            services/server/scripts/node_modules/.bin/tsx services/server/scripts/bench-recall-session-live.ts \
              --server-url "$SERVER_URL" --namespace "$NAMESPACE" --query "$QUERY" \
              --limit "$LIMIT" --runs "$WARM_RUNS" --seed-count "$REMEMBER_RUNS" --expected-commit "$EXPECTED_SERVER_COMMIT" \
              --output benchmark-results/memory-api.json
            exit 0
          fi
          services/server/scripts/node_modules/.bin/tsx services/server/scripts/bench-recall-latency.ts \
            --server-url "$SERVER_URL" \
            --delegate-key "$BENCH_DELEGATE_KEY" \
            --account-id "$BENCH_ACCOUNT_ID" \
            --remember-text "$REMEMBER_TEXT" \
            --query "$QUERY" \
            --namespace "$NAMESPACE" \
            --limit "$LIMIT" \
            --remember-runs "$REMEMBER_RUNS" \
            --post-remember-sleep-secs "$POST_REMEMBER_SLEEP_SECS" \
            --cold-runs "$COLD_RUNS" \
            --warm-runs "$WARM_RUNS" \
            --output benchmark-results/memory-api.json \
            --no-color

      - name: Write benchmark summary
        if: always()
        shell: bash
        run: |
          if [ ! -f benchmark-results/memory-api.json ]; then
            echo "No benchmark result file was produced." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          node <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('fs');
          const json = JSON.parse(fs.readFileSync('benchmark-results/memory-api.json', 'utf8'));
          console.log('## memory API benchmark');
          console.log('');
          console.log(json.markdownTable || 'No markdown table found in result JSON.');
          console.log('');
          NODE

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.run_id }}
          path: benchmark-results/memory-api.json
          if-no-files-found: warn
          retention-days: 14

  seal-session-ab:
    name: Live SEAL session source A/B
    if: github.event_name == 'workflow_dispatch' && inputs.seal_ab
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    environment:
      name: benchmark-${{ inputs.target_environment }}
    concurrency:
      group: bench-account-${{ inputs.target_environment }}
      cancel-in-progress: false
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@v4
        with:
          path: candidate
      - name: Checkout baseline source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.baseline_ref }}
          path: baseline
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            candidate/services/server/scripts/package-lock.json
            baseline/services/server/scripts/package-lock.json
      - name: Install candidate dependencies
        working-directory: candidate/services/server/scripts
        run: npm ci
      - name: Install baseline dependencies
        working-directory: baseline/services/server/scripts
        run: npm ci
      - name: Run read-only live SEAL A/B
        working-directory: candidate/services/server/scripts
        env:
          BENCH_SERVER_URL: ${{ inputs.server_url || vars.BENCH_SERVER_URL }}
          BENCH_ACCOUNT_ID: ${{ secrets.BENCH_ACCOUNT_ID }}
          BENCH_DELEGATE_KEY: ${{ secrets.BENCH_DELEGATE_KEY }}
          MEMWAL_SEAL_POLICY_PACKAGE_ID: ${{ vars.MEMWAL_SEAL_POLICY_PACKAGE_ID }}
        run: |
          node --import tsx bench-seal-session-live.ts \
            --baseline-root "$GITHUB_WORKSPACE/baseline" \
            --candidate-root "$GITHUB_WORKSPACE/candidate" \
            --rounds 4 --warm-runs 5 \
            --output "$GITHUB_WORKSPACE/benchmark-results/seal-session-ab.json"
      - name: Write live A/B summary
        if: always()
        shell: bash
        run: |
          node <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('node:fs');
          const file = 'benchmark-results/seal-session-ab.json';
          if (!fs.existsSync(file)) {
            console.log('Live SEAL A/B did not produce results. No speedup is established.');
            process.exit(0);
          }
          const r = JSON.parse(fs.readFileSync(file, 'utf8'));
          console.log('## Live SEAL source A/B');
          console.log(`Baseline: ${r.baselineCommit}; candidate: ${r.candidateCommit}`);
          console.log('');
          console.log(r.scope);
          console.log('');
          if (!r.completed) {
            console.log('Benchmark incomplete. No speedup is established.');
            process.exit(0);
          }
          console.log('| Results | Session | Baseline p50 ms | Candidate p50 ms | Reduction |');
          console.log('|---|---|---:|---:|---:|');
          for (const c of r.comparisons) console.log(`| ${c.limit} | ${c.phase} | ${c.baseline.p50.toFixed(0)} | ${c.candidate.p50.toFixed(0)} | ${c.p50ReductionPercent.toFixed(1)}% |`);
          console.log('');
          console.log('Cold = fresh session with public metadata prewarmed. Real Sui, PTB, SEAL key fetch and decrypt; synthetic ciphertexts, no transactions or Walrus writes. This is not end-to-end recall latency.');
          NODE
      - name: Upload live SEAL A/B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seal-session-ab-${{ github.run_id }}
          path: benchmark-results/seal-session-ab.json
          if-no-files-found: warn
          retention-days: 14
