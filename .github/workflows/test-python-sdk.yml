name: Test Python SDK

on:
  pull_request:
    paths:
      - 'packages/python-sdk-memwal/**'
      - '.github/workflows/test-python-sdk.yml'
      - '.github/actions/wait-for-relayer/**'
      - '.github/actions/setup-python/**'
      - 'scripts/bootstrap-python-security.py'
      - 'scripts/tests/test_bootstrap_python_security.py'
      - '.python-version'
      - 'services/server/benchmarks/**'
  push:
    branches:
      - main
      - staging
      - dev
    paths:
      - 'packages/python-sdk-memwal/**'
      - '.github/workflows/test-python-sdk.yml'
      - '.github/actions/wait-for-relayer/**'
      - '.github/actions/setup-python/**'
      - 'scripts/bootstrap-python-security.py'
      - 'scripts/tests/test_bootstrap_python_security.py'
      - '.python-version'
      - 'services/server/benchmarks/**'
  workflow_dispatch:
  schedule:
    # Catches relayer drift with no code change to trigger it.
    - cron: '17 9 * * 1'

concurrency:
  group: test-python-sdk-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: packages/python-sdk-memwal

jobs:
  unit:
    name: Unit / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        # Tracks requires-python and the pyproject classifiers.
        python-version: ['3.11.17', '3.12.15', '3.13.17', '3.14.9']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: ./.github/actions/setup-python
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build and install from source
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Lint
        run: python -m ruff check memwal/ tests/

      - name: Unit tests
        run: python -m pytest tests/ -m "not integration" -q

      - name: Verify bootstrap integrity failure
        run: python -m unittest discover -s ../../scripts/tests -p test_bootstrap_python_security.py

      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit
          python -m pip_audit --local --skip-editable

  benchmark-unit:
    name: Benchmark / Python unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/server/benchmarks
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python
      - name: Install locked benchmark dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Unit tests
        run: python -m pytest tests/ -q
      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit
          python -m pip_audit --local

  e2e:
    name: E2E / dev relayer
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 30

    # Dev only for now; staging and production follow once their credentials
    # exist. Pull requests are excluded because environment secrets are
    # withheld from fork PRs, and every authenticated run writes real memories.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'push' && github.ref_name == 'dev')

    # Reuses the credentials benchmark-live.yml already relies on, so this
    # needs no new secrets. Namespaces keep the *data* separate — the
    # benchmark writes to `benchmark` while these tests use `sdk-test`,
    # `default` and a per-run `sdk-e2e-<uuid>` — but they do not keep the
    # *rate limit* separate: the relayer meters per delegate key and per
    # account, so the concurrency group below is what stops the three suites
    # 429ing each other. Group name must stay identical in this file,
    # test-sdk.yml, and benchmark-live.yml — byte-identical on purpose,
    # including branches this dev-only job never runs on, so the three land
    # in one group whatever the expression resolves to.
    concurrency:
      group: bench-account-${{ github.event_name == 'workflow_dispatch' && inputs.target_environment || (github.ref_name == 'main' && 'production' || github.ref_name == 'staging' && 'staging' || 'dev') }}
      cancel-in-progress: false

    environment: benchmark-dev

    env:
      # BENCH_DELEGATE_KEY is the delegate private key the SDK signs with,
      # which test_integration.py reads as MEMWAL_PRIVATE_KEY.
      MEMWAL_PRIVATE_KEY: ${{ secrets.BENCH_DELEGATE_KEY }}
      MEMWAL_ACCOUNT_ID: ${{ secrets.BENCH_ACCOUNT_ID }}
      # Public URL (internal/relayer/benchmark-ci-setup.md), defaulted so a missing
      # variable cannot silently point the run at the wrong relayer.
      MEMWAL_SERVER_URL: ${{ vars.BENCH_SERVER_URL || 'https://relayer.dev.memwal.ai' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: ./.github/actions/setup-python
        with:
          python-version: '3.11.17'

      - name: Build and install from source
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Check credentials
        id: config
        shell: bash
        run: |
          set -euo pipefail

          # Without these the `requires_key` marker skips every authenticated
          # test, and the job would report success having never called the
          # relayer. Fail instead of reporting a green run that proved nothing.
          missing=0
          for name in MEMWAL_PRIVATE_KEY MEMWAL_ACCOUNT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::${name} is empty — set BENCH_DELEGATE_KEY / BENCH_ACCOUNT_ID on the benchmark-dev environment."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "authenticated=true" >> "$GITHUB_OUTPUT"

      # Push that touched services/server/**: wait for this SHA. SDK-only
      # pushes and dispatch/schedule: health + write_ready only.
      - name: Wait for Railway deploy
        uses: ./.github/actions/wait-for-relayer
        with:
          server-url: ${{ env.MEMWAL_SERVER_URL }}
          expected-commit: ${{ github.event_name == 'push' && github.sha || '' }}
          since-commit: ${{ github.event_name == 'push' && github.event.before || '' }}

      - name: E2E tests
        id: e2e
        run: |
          python -m pytest tests/test_integration.py -m integration \
            -v --junit-xml=e2e-results.xml

      - name: Write run summary
        if: always()
        run: |
          {
            echo "## Python SDK e2e"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Relayer | \`${MEMWAL_SERVER_URL}\` |"
            echo "| Authenticated | ${{ steps.config.outputs.authenticated }} |"
            echo "| Result | ${{ steps.e2e.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload e2e results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-sdk-e2e-${{ github.run_id }}
          path: packages/python-sdk-memwal/e2e-results.xml
          if-no-files-found: warn
          retention-days: 14
