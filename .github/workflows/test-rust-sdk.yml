name: Test Rust SDK

on:
  pull_request:
    paths:
      - 'packages/rust-sdk/**'
      - '.github/workflows/test-rust-sdk.yml'
  push:
    branches:
      - main
      - dev
    paths:
      - 'packages/rust-sdk/**'
      - '.github/workflows/test-rust-sdk.yml'
  workflow_dispatch:

concurrency:
  group: test-rust-sdk-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: packages/rust-sdk

jobs:
  check:
    name: Format, Clippy, Docs & Tests (stable)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/rust-sdk

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy (pedantic + deny warnings)
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Build Rustdoc (deny warnings)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features --locked

      - name: Run unit and integration tests
        run: cargo test --all-targets --all-features --locked

      - name: Run doc tests
        run: cargo test --doc --all-features --locked

      - name: Verify crate packaging
        run: cargo package --locked

  msrv:
    name: MSRV Check (Rust 1.85.0)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust 1.85.0 toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.85.0'

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/rust-sdk
          key: msrv-1.85.0

      - name: Check against MSRV 1.85.0
        run: cargo check --all-targets --all-features --locked
