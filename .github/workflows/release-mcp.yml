name: Release MCP Package

on:
  push:
    branches:
      - main
      - staging
      - dev
    paths:
      - 'packages/mcp/**'
      - '.github/workflows/release-mcp.yml'
  workflow_dispatch:
    inputs:
      ci_test:
        description: Publish an isolated ci-test prerelease from the test branch
        required: false
        type: boolean
        default: false

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Version & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Diagnose npm OIDC trust
        if: github.event_name == 'workflow_dispatch' && inputs.ci_test && github.ref == 'refs/heads/codex/mcp-publish-ci-test'
        uses: actions/github-script@v7
        with:
          script: |
            const idToken = await core.getIDToken('npm:registry.npmjs.org');
            const claims = JSON.parse(Buffer.from(idToken.split('.')[1], 'base64url').toString());
            const keys = ['iss', 'aud', 'sub', 'repository', 'repository_id', 'repository_owner',
              'repository_owner_id', 'workflow_ref', 'job_workflow_ref', 'ref',
              'event_name', 'environment', 'runner_environment'];
            core.info('OIDC identity: ' + JSON.stringify(Object.fromEntries(
              keys.map(key => [key, claims[key] ?? null])
            )));
            const pkg = JSON.parse(require('node:fs').readFileSync('packages/mcp/package.json', 'utf8'));
            core.info('Package identity: ' + JSON.stringify({name: pkg.name, repository: pkg.repository}));
            let canonicalAccepted = false;
            const variants = [
              ['npm-escaped-name', pkg.name.replace('/', '%2f')],
              ['fully-url-encoded', encodeURIComponent(pkg.name)],
            ];
            for (const [encoding, name] of variants) {
              const response = await fetch(
                'https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/' + name,
                {method: 'POST', headers: {Authorization: 'Bearer ' + idToken}}
              );
              const data = await response.json().catch(() => ({}));
              if (data.token) core.setSecret(data.token);
              core.info('npm OIDC exchange: ' + JSON.stringify({
                encoding, status: response.status, accepted: response.ok,
                code: data.code, error: data.error, message: data.message
              }));
              if (encoding === 'npm-escaped-name') canonicalAccepted = response.ok;
            }
            if (!canonicalAccepted) {
              core.warning('npm canonical token exchange failed; the direct npm publish probe will verify independently.');
            }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @mysten-incubation/memwal-mcp typecheck

      - name: Build MCP package
        run: pnpm --filter @mysten-incubation/memwal-mcp build

      # Gate every publish on the integration suite (auth-required -> bridge
      # hot-handoff, login callback). Never ship the MCP package without it.
      - name: Test MCP package
        run: pnpm --filter @mysten-incubation/memwal-mcp test

      # ── main branch → changeset version + stable release (latest) ──
      - name: Apply changesets (update version & CHANGELOG)
        if: github.ref == 'refs/heads/main'
        id: changeset_version
        run: |
          pnpm changeset version 2>/dev/null || true
          if git diff --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit changelog & version bump
        if: github.ref == 'refs/heads/main' && steps.changeset_version.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: version packages & update changelog [skip ci]"
          git push

      - name: Publish stable release
        if: github.ref == 'refs/heads/main'
        id: publish_mcp
        run: |
          VERSION=$(node -p "require('./packages/mcp/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          npm view @mysten-incubation/memwal-mcp@$VERSION version 2>/dev/null \
            && echo "Version $VERSION already published, skipping" && echo "published=false" >> $GITHUB_OUTPUT && exit 0
          cd packages/mcp && pnpm publish --provenance --access public --no-git-checks
          echo "published=true" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' && steps.publish_mcp.outputs.published == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const version = '${{ steps.publish_mcp.outputs.version }}';
            const tag = `@mysten-incubation/memwal-mcp@${version}`;
            let body = `Release @mysten-incubation/memwal-mcp v${version}`;
            try {
              const changelog = fs.readFileSync('packages/mcp/CHANGELOG.md', 'utf8');
              const match = changelog.match(/## \d+\.\d+\.\d+[\s\S]*?(?=## \d+\.\d+\.\d+|$)/);
              if (match) body = match[0].trim();
            } catch (e) { /* use default body */ }
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: tag,
              body,
              draft: false,
              prerelease: false,
            });

      # ── staging branch → release candidate (rc tag, auto-increment) ──
      - name: Publish staging release candidate
        if: github.ref == 'refs/heads/staging'
        run: .github/scripts/publish-prerelease.sh packages/mcp @mysten-incubation/memwal-mcp rc

      # ── dev branch → prerelease (dev tag, auto-increment) ──
      - name: Publish dev prerelease
        if: github.ref == 'refs/heads/dev'
        run: .github/scripts/publish-prerelease.sh packages/mcp @mysten-incubation/memwal-mcp dev

      # Temporary probe: publish only the isolated ci-test channel from this branch.
      - name: Publish isolated CI test prerelease
        if: github.event_name == 'workflow_dispatch' && inputs.ci_test && github.ref == 'refs/heads/codex/mcp-publish-ci-test'
        env:
          NPM_CONFIG_LOGLEVEL: http
        run: |
          set -euo pipefail
          version="$(node -p "require('./packages/mcp/package.json').version")-ci-test.0"
          node -e 'const fs = require("fs"); const p = "packages/mcp/package.json"; const pkg = JSON.parse(fs.readFileSync(p, "utf8")); pkg.version = process.argv[1]; fs.writeFileSync(p, JSON.stringify(pkg, null, 4) + "\n");' "$version"
          out_dir="$RUNNER_TEMP/mcp-ci-test-pack"
          mkdir -p "$out_dir"
          (cd packages/mcp && pnpm pack --pack-destination "$out_dir")
          npm publish "$out_dir"/*.tgz --tag ci-test --provenance --access public --loglevel verbose
