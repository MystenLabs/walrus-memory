[project]
name = "memwal-benchmarks"
version = "0.1.0"
description = "Retrieval quality benchmarks for Walrus Memory"
requires-python = ">=3.11"
dependencies = [
    "datasets>=5.0.1",      # HuggingFace dataset loading (LOCOMO)
    "huggingface_hub>=0.20",# hf_hub_download for the LongMemEval oracle —
                            # imported directly in benchmarks/longmemeval.py
                            # (also a transitive dep of datasets; declared
                            # here because we import it explicitly)
    "openai>=1.30",         # LLM judge + answer generation
    "httpx>=0.28.1",        # async HTTP client for Walrus Memory API
    "pynacl>=1.6.2",        # Ed25519 signing
    "certifi>=2026.10.19",
    "anyio>=4.14.2,<5",
    "urllib3>=2.8.0",
    "fsspec[http]>=2026.6.0",
    "aiohttp>=3.14.4",
    "numpy>=1.26",          # metric computation
    "pyyaml>=6.0",          # config parsing
    "tabulate>=0.9",        # terminal table formatting
    "tqdm>=4.66",           # progress bars
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"
