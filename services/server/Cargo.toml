[package]
name = "memwal-server"
version = "0.1.0"
edition = "2021"

[features]
# Lets the HTTP-only GitHub Actions E2E boot before the new contract is
# published. It only changes debug builds; release builds stay fail-closed.
ci-offline-onchain = []

[dependencies]
# Web framework
axum = { version = "0.8", features = ["macros", "form"] }
tokio = { version = "1", features = ["full", "test-util"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Database (PostgreSQL + pgvector)
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "postgres", "chrono", "uuid", "migrate", "macros"] }
pgvector = { version = "=0.4.1", features = ["sqlx"] }

# Auth
ed25519-dalek = { version = "2", features = ["serde"] }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"

# In-process Walrus & SEAL Rust SDKs (replaces Node.js/TypeScript sidecar)
walrus-core = { git = "https://github.com/MystenLabs/walrus.git", branch = "main", default-features = false }
seal-sdk = { git = "https://github.com/MystenLabs/seal.git", tag = "seal-v0.6.16" }
seal-crypto = { package = "crypto", git = "https://github.com/MystenLabs/seal.git", tag = "seal-v0.6.16" }
fastcrypto = { git = "https://github.com/MystenLabs/fastcrypto", rev = "076bf5ad8cea140dc7cf5c5861c24a36acdf64ce" }


# MCP OAuth (Claude custom connectors) — AES-256-GCM envelope for
# server-custodied delegate keys, ported from the reviewed WALM-30/ENG-1783
# `app_auth.rs` design (branch feature/eng-1783-hosted-connect-memwal-flow-
# for-web-apps, PR #193, unmerged). See services/server/src/oauth.rs.
aes-gcm = "0.10"
rand = "0.8"
blake2 = "0.10"
ipnet = "2"
zeroize = "1"
url = "2"

# Background job queue — persistent metadata+transfer tasks
apalis     = { version = "0.7", default-features = false, features = ["tracing"] }
apalis-sql = { version = "0.7", features = ["postgres", "migrate"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Config
dotenvy = "0.15"

# Logging / observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
prometheus = "0.13"
opentelemetry = { version = "0.31", features = ["logs", "trace"] }
opentelemetry_sdk = { version = "0.31", features = ["logs", "rt-tokio", "trace"] }
opentelemetry-otlp = { version = "0.31", default-features = false, features = ["http-json", "logs", "reqwest-blocking-client", "trace"] }
opentelemetry-appender-tracing = "0.31"
tracing-opentelemetry = "0.32"

# HTTP client (legacy Sui JSON-RPC — being phased out per the 2026-07-31 sunset)
reqwest = { version = "0.12", features = ["json", "stream"] }

# Sui gRPC client (for onchain account/delegate-key verification, migrating
# off the JSON-RPC calls above — testnet's public JSON-RPC endpoint already
# returns 404, ahead of the documented sunset)
sui-rpc = "=0.3.1"
sui-sdk-types = { version = "=0.3.1", features = ["hash", "serde"] }
sui-transaction-builder = { version = "=0.3.1", default-features = false }
sui-crypto = { version = "=0.3.0", features = ["ed25519", "secp256k1", "secp256r1", "passkey", "zklogin"] }
prost-types = "0.14"
tonic = "0.14"
httpdate = "1"

# Async utilities
arc-swap = "1.9"
futures = "0.3"
async-trait = "0.1"

# Rate limiting (Redis-backed)
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }

# Utils
uuid = { version = "1", features = ["v4", "serde"] }
chrono = "0.4"
base64 = "0.22"
bcs = "0.1"
percent-encoding = "2"
