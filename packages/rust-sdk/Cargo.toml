[package]
name = "memwal"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Official Rust SDK for Walrus Memory: encrypted decentralized memory for AI agents on Sui and Walrus"
license = "Apache-2.0"
repository = "https://github.com/MystenLabs/MemWal"
homepage = "https://memory.walrus.xyz"
documentation = "https://docs.rs/memwal"
readme = "README.md"
keywords = ["walrus", "memory", "sui", "ai", "agent"]
categories = ["api-bindings", "asynchronous", "cryptography"]

[dependencies]
base64 = "0.22"
blake2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ed25519-dalek = { version = "2", features = ["rand_core", "zeroize"] }
hex = "0.4"
percent-encoding = "2"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time"] }
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
wiremock = "0.6"

[lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "allow"
panic_in_result_fn = "warn"
missing_panics_doc = "warn"
missing_errors_doc = "warn"
missing_assert_message = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
fn_params_excessive_bools = "warn"
struct_excessive_bools = "warn"
clone_on_ref_ptr = "warn"
redundant_clone = "warn"
rc_buffer = "warn"
exhaustive_enums = "warn"
string_add = "warn"
wildcard_imports = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"
as_conversions = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
module_inception = "allow"
enum_glob_use = "allow"
