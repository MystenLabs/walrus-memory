[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memwal"
version = "0.2.0"
description = "Python SDK for Walrus Memory — Privacy-first AI memory with Ed25519 signing"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Walrus Memory Team" },
]
keywords = ["memwal", "walrus-memory", "ai", "memory", "ed25519", "privacy", "walrus", "sui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28.1",
    "PyNaCl>=1.6.2",
    "certifi>=2026.10.19",
    "anyio>=4.14.2,<5",
]

[project.optional-dependencies]
langchain = ["langchain-core>=0.2.0"]
openai = ["openai>=1.0.0"]
all = ["langchain-core>=0.2.0", "openai>=1.0.0"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
    "ruff>=0.4.0",
    "langchain-core>=0.2.0",
]

[project.urls]
Homepage = "https://memory.walrus.xyz"
Documentation = "https://memory.walrus.xyz"
Repository = "https://github.com/MystenLabs/MemWal"

[tool.hatch.build.targets.wheel]
packages = ["memwal"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: live relayer integration tests",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
